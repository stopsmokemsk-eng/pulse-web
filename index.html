<!doctype html><html lang=ru data-theme=minimal><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>PULSE</title><style>html[data-theme=minimal]{--bg:#f4f1ea;--el:#fffdf8;--ink:#161616;--mu:#6d6a64;--ln:#ddd6c8;--ac:#1f1f1f;--ai:#fff}html[data-theme=vivid]{--bg:#14081c;--el:#24112f;--ink:#fff5fb;--mu:#c9a8d8;--ln:#4a2a58;--ac:#ff3d8a;--ai:#fff}*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{font-family:system-ui;background:var(--bg);color:var(--ink)}.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}.top,.player{display:flex;justify-content:space-between;padding:16px}.screen{flex:1;padding:16px}.btn-wide,.theme-btn,.icon-btn,.btn{padding:12px;border-radius:14px;border:1px solid var(--ln);background:var(--el);color:var(--ink);font-weight:700}.btn-wide{width:100%;margin:8px 0;background:var(--ac);color:var(--ai);border:0}.tabs{display:grid;grid-template-columns:repeat(4,1fr)}.tabs button{border:0;background:0;padding:12px;color:var(--mu);font-weight:700}.ph{width:72px;height:72px;border-radius:50%;background:var(--ln);display:inline-block;margin-right:6px}.track{display:block;width:100%;margin:6px 0;padding:12px;border-radius:14px;border:1px solid var(--ln);background:var(--el);text-align:left}.overlay{position:fixed;inset:0;background:var(--bg);padding:16px}</style></head><body><div id=app></div><script>const S={theme:localStorage.getItem('pulse-theme')||'minimal',tab:'me',tid:'t1',wave:null,show:null,n:0};const P=[{id:'t1',title:'Ночной трамвай'},{id:'t2',title:'Тише'},{id:'t3',title:'Дом на холме'}];const T=()=>P.find(x=>x.id===S.tid)||P[0];function th(t){S.theme=t;document.documentElement.setAttribute('data-theme',t);localStorage.setItem('pulse-theme',t)}function go(){if(S.wave){S.show=1;draw();return}if(S.n>=3){alert('Лимит 3 волны в день');return}S.n++;S.wave={title:T().title};S.show=1;draw()}function draw(){th(S.theme);const t=T();const me='<div>'+'<div class=ph></div>'.repeat(5)+'</div><h1>Аня</h1><p>жен · 26</p>'+P.map(x=>'<button class=track data-pick='+x.id+'>'+x.title+'</button>').join('')+'<button class=btn-wide data-act=wave>Создать Волну</button><button class=btn-wide data-act=catch>Поймать Волну</button><p>Волн сегодня '+S.n+'/3</p>';const waves='<p>Марк · Неон</p><p>Лиза · Окно</p>';const fr='<p>Нужен доступ: Кира</p><p>Открытые: Олег</p><p>Друзья: Мила</p>';const st='<p>Сцена и клубы — следующий срез</p>';const body=S.tab==='me'?me:S.tab==='waves'?waves:S.tab==='friends'?fr:st;const ov=S.show?'<section class=overlay><button data-act=close>Закрыть</button><h1>'+S.wave.title+'</h1><p>Визуал волны · 3 часа · лайки трека</p><p>Комментарии видны всем</p></section>':'';document.getElementById('app').innerHTML='<div class=app><div class=top><b class=brand>PULSE</b><button class=theme-btn data-act=theme>'+(S.theme==='minimal'?'Яркая':'Минимал')+'</button></div><main class=screen>'+body+'</main><div class=player><b>'+t.title+'</b><button class=icon-btn data-act=wave>▶</button></div><nav class=tabs><button data-tab=me>Я</button><button data-tab=waves>Волны</button><button data-tab=friends>Друзья</button><button data-tab=stage>Сцена</button></nav>'+ov+'</div>'}document.getElementById('app').onclick=e=>{const a=e.target.closest('[data-tab],[data-pick],[data-act]');if(!a)return;if(a.dataset.tab)S.tab=a.dataset.tab;if(a.dataset.pick)S.tid=a.dataset.pick;if(a.dataset.act==='theme')th(S.theme==='minimal'?'vivid':'minimal');if(a.dataset.act==='wave')go();if(a.dataset.act==='catch')S.tab='waves';if(a.dataset.act==='close')S.show=null;draw()};th(S.theme);draw();</script></body></html>

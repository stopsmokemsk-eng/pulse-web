<!doctype html>
<html lang="ru" data-theme="minimal">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>PULSE</title>
<style>
html[data-theme=minimal]{--bg:#f4f1ea;--el:#fffdf8;--ink:#161616;--mu:#6d6a64;--ln:#ddd6c8;--ac:#1f1f1f;--ai:#fff;--wv:#161616;--ch:#efeae0;--rd:16px}
html[data-theme=vivid]{--bg:#14081c;--el:#24112f;--ink:#fff5fb;--mu:#c9a8d8;--ln:#4a2a58;--ac:#ff3d8a;--ai:#fff;--wv:#7af0ff;--ch:#1b0c24;--rd:22px}
*{box-sizing:border-box}html,body,#app{height:100%;margin:0}body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.top,.player{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.brand{letter-spacing:.14em;font-weight:800}.screen{flex:1;overflow:auto;padding:8px 16px 18px}
.theme-btn,.icon-btn,.btn{border:1px solid var(--ln);background:var(--el);color:var(--ink);border-radius:999px;padding:8px 12px;font-weight:700}
.photos{display:flex;gap:8px;overflow:auto}.ph{width:70px;height:70px;border-radius:50%;background:var(--ln);flex:0 0 auto}.ph.main{width:88px;height:88px}
h1{margin:8px 0 0;font-size:28px}.sub,.muted,.shelf{color:var(--mu)}.tracks{max-height:210px;overflow:auto}
.track,.card{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 8px;padding:12px 14px;border-radius:var(--rd);border:1px solid var(--ln);background:var(--el);text-align:left;color:var(--ink)}
.track.active{outline:2px solid var(--ac)}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.wide{width:100%;margin:8px 0 0;padding:14px;border:0;border-radius:var(--rd);background:var(--ac);color:var(--ai);font-weight:800}
.wide.ghost{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.player,.tabs{position:sticky;bottom:0;background:var(--el);border-top:1px solid var(--ln)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:6px 0 12px}.tabs button{border:0;background:0;color:var(--mu);font-weight:700;padding:10px}.tabs button.on{color:var(--ink)}
.bars{height:150px;margin:8px 0 16px;padding:16px;border-radius:var(--rd);background:var(--el);display:flex;align-items:end;gap:4px}
.bars i{flex:1;background:var(--wv);border-radius:99px;animation:w 1.1s ease-in-out infinite;transform-origin:bottom}
@keyframes w{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.chat{background:var(--ch);border-radius:var(--rd);padding:12px;max-height:240px;overflow:auto}.item{padding:10px 0;border-bottom:1px solid var(--ln)}
.shelf{font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 8px}
</style></head><body><div id="app"></div><script>
const S={theme:localStorage.getItem("pulse-theme")||"minimal",tab:"me",tid:"t1",wave:null,n:0};
const P=[{id:"t1",title:"Ночной трамвай",by:"PULSE Radio",likes:42},{id:"t2",title:"Тише",by:"Север",likes:19},{id:"t3",title:"Дом на холме",by:"Маяк",likes:33},{id:"t4",title:"После дождя",by:"Кадр",likes:11},{id:"t5",title:"Пульс",by:"Аня",likes:7}];
const W=[{n:"Марк",t:"Неон",l:86,c:12},{n:"Лиза",t:"Окно",l:54,c:7},{n:"Тимур",t:"Быстрее",l:21,c:3}];
const F={a:[{n:"Кира",r:"лайкнула трек"}],b:[{n:"Олег",r:"доступ открыт"}],c:[{n:"Мила",r:"взаимный лайк"}]};
const C=[{n:"Олег",t:"этот припев держит"},{n:"Кира",t:"лайк треку"},{n:"Мила",t:"можно ещё эфир"}];
const T=()=>P.find(x=>x.id===S.tid)||P[0];
const th=t=>{S.theme=t;document.documentElement.setAttribute("data-theme",t);localStorage.setItem("pulse-theme",t)};
function left(){if(!S.wave)return"";const ms=Math.max(0,S.wave.end-Date.now());const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")}
function start(){if(S.wave){S.tab="live";draw();return}if(S.n>=3){alert("Бесплатно 3 волны в день");return}S.n++;S.wave={title:T().title,likes:T().likes,end:Date.now()+108e5};S.tab="live";draw()}
function cards(list){return list.map(x=>`<article class=\"card\"><div><b>${x.n}</b><div class=\"muted\">${x.r||x.t}</div></div></article>`).join("")}
function me(){return `<div class=\"photos\">${[0,1,2,3,4].map((i,k)=>`<div class=\"ph${k?\"\":\" main\"}\"></div>`).join(\"\")}</div><h1>Аня</h1><p class=\"sub\">жен · 26</p><div class=\"tracks\">${P.map(x=>`<button class=\"track${x.id===S.tid?\" active\":\"\"}\" data-pick=\"${x.id}\"><div><b>${x.title}</b><div class=\"muted\">${x.by}</div></div><span>♥ ${x.likes}</span></button>`).join(\"\")}</div><div class=\"row\"><button class=\"btn\" data-act=\"lib\">Библиотека</button><button class=\"btn\" data-act=\"up\">Загрузить свой</button></div><button class=\"wide\" data-act=\"wave\">Создать Волну</button><button class=\"wide ghost\" data-act=\"catch\">Поймать Волну</button><p class=\"muted\">Рейтинг плейлиста · 128 · волн сегодня ${S.n}/3</p>`}
function live(){if(!S.wave)return me();const bars=Array.from({length:26},(_,i)=>`<i style=\"height:${28+(i*29)%72}%;animation-delay:${i*.03}s\"></i>`).join(\"\");return `<button class=\"btn\" data-act=\"back\">Назад в Я</button><div class=\"bars\">${bars}</div><h1>${S.wave.title}</h1><p>♥ ${S.wave.likes} лайков трека</p><p class=\"muted\">осталось ${left()} · один трек · 3 часа</p><div class=\"chat\">${C.map(x=>`<div class=\"item\"><b>${x.n}</b><div class=\"muted\">${x.t}</div></div>`).join(\"\")}</div>`}
function waves(){return `<div class=\"shelf\">Публичные волны</div>`+W.map(x=>`<article class=\"card\"><div><b>${x.n}</b><div>${x.t}</div></div><span>♥ ${x.l}</span></article>`).join(\"\")}
function friends(){return `<div class=\"shelf\">Нужен доступ</div>${cards(F.a)}<div class=\"shelf\">Открытые</div>${cards(F.b)}<div class=\"shelf\">Друзья</div>${cards(F.c)}`}
function stage(){return `<article class=\"card\"><div><b>Сцена</b><div class=\"muted\">Клубы на 100–200 — следующий срез</div></div></article>`}
function draw(){th(S.theme);const map={me,waves,friends,stage,live};const titles={me:"Я",waves:"Волны",friends:"Друзья",stage:"Сцена",live:"Волна"};const t=T();document.getElementById("app").innerHTML=`<div class=\"app\"><div class=\"top\"><div class=\"brand\">PULSE</div><button class=\"theme-btn\" data-act=\"theme\">${S.theme===\"minimal\"?\"Яркая\":\"Минимал\"}</button></div><main class=\"screen\"><div class=\"shelf\">${titles[S.tab]}</div>${map[S.tab]()}</main><div class=\"player\"><div><b>${t.title}</b><div class=\"muted\">${S.wave?\"в эфире\":\"не в эфире\"}</div></div><button class=\"icon-btn\" data-act=\"wave\">▶</button></div><nav class=\"tabs\"><button data-tab=\"me\" class=\"${S.tab===\"me\"||S.tab===\"live\"?\"on\":\"\"}\">Я</button><button data-tab=\"waves\" class=\"${S.tab===\"waves\"?\"on\":\"\"}\">Волны</button><button data-tab=\"friends\" class=\"${S.tab===\"friends\"?\"on\":\"\"}\">Друзья</button><button data-tab=\"stage\" class=\"${S.tab===\"stage\"?\"on\":\"\"}\">Сцена</button></nav></div>`}
document.getElementById("app").onclick=e=>{const a=e.target.closest(\"[data-tab],[data-pick],[data-act]\");if(!a)return;if(a.dataset.tab)S.tab=a.dataset.tab;if(a.dataset.pick)S.tid=a.dataset.pick;if(a.dataset.act===\"theme\")th(S.theme===\"minimal\"?\"vivid\":\"minimal\");if(a.dataset.act===\"wave\")start();if(a.dataset.act===\"catch\")S.tab=\"waves\";if(a.dataset.act===\"back\")S.tab=\"me\";if(a.dataset.act===\"lib\")alert(\"Библиотека — следующий срез\");if(a.dataset.act===\"up\"){P.push({id:\"t\"+(P.length+1),title:\"Новый трек\",by:\"с устройства\",likes:0});S.tid=P[P.length-1].id}draw()};
th(S.theme);draw();setInterval(()=>{if(S.tab===\"live\"&&S.wave)draw()},1000);
</script></body></html>
